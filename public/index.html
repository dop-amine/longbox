<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only dark">
<meta name="theme-color" content="#0D0D0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Longbox">
<title>Longbox</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:only dark;
    --paper:#0D0D0F;
    --card:#17171B;
    --ink:#F2F1EB;
    --ink-soft:#A9A9B2;
    --hair:#34343C;
    --red:#F03A41;
    --blue:#7C93E8;
    --display:'Big Shoulders Display','Haettenschweiler','Arial Narrow',Impact,sans-serif;
    --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#0D0D0F}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--body);
    font-size:16px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    padding-bottom:86px;
  }
  .wrap{max-width:820px;margin:0 auto;padding:0 18px}

  /* ---------- library bar (which reading order) ---------- */
  .library{
    display:flex;align-items:center;gap:8px;padding:14px 0 0;
  }
  .library select{
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    background:var(--card);color:var(--ink);border:1px solid var(--hair);
    padding:7px 10px;max-width:min(60vw,340px);cursor:pointer;
    appearance:none;-webkit-appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);
    background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px;
  }
  .library select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .libmenu{
    display:none;margin:10px 0 0;border:1px solid var(--hair);background:var(--card);padding:12px;
  }
  .libmenu.open{display:block}
  .libmenu h3{
    font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--red);margin:0 0 8px;font-weight:600;
  }
  .libmenu .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .libmenu .row:last-child{margin-bottom:0}
  .libmenu p.muted{
    font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin:0 0 8px;line-height:1.5;
  }

  /* ---------- masthead ---------- */
  header.mast{padding:20px 0 22px;border-bottom:3px solid var(--ink)}
  .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-soft);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .eyebrow b{color:var(--red);font-weight:600}
  h1{
    font-family:var(--display);font-weight:800;
    font-size:clamp(52px,15vw,116px);line-height:.84;letter-spacing:-.015em;
    text-transform:uppercase;margin:14px 0 0;
  }
  h1 .thin{display:block;font-weight:500;color:var(--red)}
  .deck{
    margin:14px 0 0;max-width:46ch;font-size:15px;color:var(--ink-soft);
  }
  .mast-tools{display:none;gap:6px;margin:14px 0 0}
  body.editing .mast-tools{display:flex}

  /* ---------- progress meter ---------- */
  .meter{
    margin:26px 0 0;padding:20px;background:var(--card);
    border:1px solid var(--hair);
    display:grid;grid-template-columns:130px 1fr;gap:20px;align-items:center;
  }
  @media(max-width:520px){.meter{grid-template-columns:1fr;gap:14px}}
  .diagram{width:130px;height:96px;display:block}
  .diagram circle{mix-blend-mode:screen;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
  .readout .big{
    font-family:var(--display);font-weight:800;font-size:60px;line-height:.85;letter-spacing:-.01em;
  }
  .readout .big span{color:var(--ink-soft);font-size:26px;letter-spacing:0}
  .readout .lbl{
    font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-soft);margin-top:8px;
  }
  .bar{height:6px;background:#2B2B33;margin-top:12px;position:relative;overflow:hidden}
  .bar i{position:absolute;inset:0 auto 0 0;width:0%;background:var(--red);transition:width .4s ease}

  /* ---------- sections ---------- */
  section.blk{margin:38px 0 0;scroll-margin-top:12px}
  .blk-head{
    display:flex;align-items:baseline;gap:14px;
    border-bottom:2px solid var(--ink);padding-bottom:8px;
  }
  .num{
    font-family:var(--mono);font-weight:600;font-size:13px;color:var(--red);letter-spacing:.08em;
  }
  .blk-head h2{
    font-family:var(--display);font-weight:700;text-transform:uppercase;
    font-size:clamp(26px,6vw,40px);line-height:1;letter-spacing:-.01em;margin:0;flex:1;
  }
  .tally{font-family:var(--mono);font-size:12px;color:var(--ink-soft);white-space:nowrap}
  .blk-note{
    font-size:14px;color:var(--ink-soft);margin:10px 0 2px;max-width:60ch;
  }
  .blk-note.flag{
    border-left:3px solid var(--red);padding-left:10px;
  }
  /* Which book to pull off the shelf. Mono and boxed so it reads as reference
     data rather than more prose — you scan this, you don't read it. */
  .blk-collected{
    margin:12px 0 2px;border:1px solid var(--hair);background:#131317;
    padding:10px 12px;max-width:64ch;
  }
  .blk-collected .lbl{
    font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--red);display:block;margin-bottom:5px;
  }
  .blk-collected p{
    font-family:var(--mono);font-size:12px;line-height:1.55;color:var(--ink-soft);margin:0;
  }

  ul.list{list-style:none;margin:12px 0 0;padding:0}
  li.row{border-bottom:1px solid var(--hair);display:flex;align-items:center}
  li.row label{
    display:flex;align-items:center;gap:14px;padding:11px 6px;cursor:pointer;flex:1;min-width:0;
  }
  li.row input[type=checkbox]{position:absolute;opacity:0;width:0;height:0}
  .box{
    flex:0 0 auto;width:20px;height:20px;border:1.5px solid var(--ink);
    background:transparent;position:relative;transition:background .12s ease;
  }
  .box::after{
    content:"";position:absolute;inset:3px;background:var(--red);
    transform:scale(0);transition:transform .14s cubic-bezier(.2,.8,.2,1);
  }
  input:checked + .box::after{transform:scale(1)}
  input:focus-visible + .box{outline:3px solid var(--blue);outline-offset:2px}
  .title{flex:1;font-weight:500;min-width:0}
  .issue{
    font-family:var(--mono);font-weight:600;font-size:14px;white-space:nowrap;
  }
  .note{
    display:block;font-size:12.5px;color:var(--ink-soft);font-weight:400;margin-top:1px;
  }
  input:checked ~ .title,input:checked ~ .issue{color:var(--ink-soft)}
  input:checked ~ .title{text-decoration:line-through;text-decoration-thickness:1px}
  li.row.alt .title{color:var(--blue)}
  li.row.alt input:checked ~ .title{color:var(--ink-soft)}

  /* A row can point at wherever the issue actually lives. Outside the label,
     so opening it never toggles the tick. */
  .readlink{
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--blue);border:1px solid var(--hair);padding:5px 7px;margin-right:4px;
    text-decoration:none;flex:0 0 auto;
  }
  .readlink:hover{border-color:var(--blue);color:#fff}
  .readlink:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

  /* ---------- filtering ---------- */
  .filters{display:flex;align-items:center;gap:8px;margin:24px 0 0;flex-wrap:wrap}
  .filters input[type=search]{
    font-family:var(--body);font-size:14px;color:var(--ink);
    background:#101014;border:1px solid var(--hair);padding:8px 10px;flex:1;min-width:180px;
  }
  .filters input[type=search]:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
  .filters .count{font-family:var(--mono);font-size:11px;color:var(--ink-soft);white-space:nowrap}

  /* ---------- read-only view ---------- */
  /* Hides the controls for someone you sent a link to. It is a presentation
     mode, not a permission: anyone who can reach the host can still call the
     API. The network is the only real gate. */
  body.readonly .library,
  body.readonly .libmenu,
  body.readonly .mast-tools,
  body.readonly .tools,
  body.readonly .adder,
  body.readonly #editBtn,
  body.readonly #resetBtn{display:none!important}
  body.readonly li.row label{cursor:default}

  /* ---------- edit mode ---------- */
  .tools{display:none;gap:4px;padding:0 4px;flex:0 0 auto}
  body.editing .tools{display:flex}
  .tool{
    font-family:var(--mono);font-size:12px;line-height:1;
    background:transparent;color:var(--ink-soft);border:1px solid var(--hair);
    padding:6px 7px;cursor:pointer;min-width:28px;
  }
  .tool:hover{border-color:var(--red);color:#fff}
  .tool.danger:hover{border-color:var(--red);color:var(--red)}
  .adder{display:none;margin:10px 0 0}
  body.editing .adder{display:block}
  .adder button{width:100%;border-style:dashed}

  .form{flex:1;padding:14px 6px;display:grid;gap:10px}
  .form.meta{padding:16px 0 4px}
  .form .field{display:grid;gap:4px}
  .form label.lbl{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft);cursor:default;padding:0;display:block;
  }
  .form input[type=text]{
    font-family:var(--body);font-size:15px;color:var(--ink);
    background:#101014;border:1px solid var(--hair);padding:9px 10px;width:100%;
  }
  .form input[type=text]:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
  .form .checks{display:flex;gap:18px;flex-wrap:wrap}
  .form .check{
    display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);cursor:pointer;
  }
  .form .check input{width:16px;height:16px;accent-color:var(--red)}
  .form .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
  .form .actions .spacer{flex:1}
  .hint{
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink-soft);
    border-left:3px solid var(--blue);padding-left:10px;margin:14px 0 0;display:none;
  }
  body.editing .hint{display:block}

  /* Shown when an order has no sections yet. Without it a new list is a blank
     page whose only control is hidden behind edit mode. */
  .empty{
    margin:38px 0 0;border:1px dashed var(--hair);padding:24px;
  }
  .empty h2{
    font-family:var(--display);font-weight:700;text-transform:uppercase;
    font-size:clamp(24px,5vw,34px);line-height:1;margin:0 0 10px;
  }
  .empty p{font-size:14px;color:var(--ink-soft);margin:0 0 14px;max-width:56ch}
  .empty .row{display:flex;gap:8px;flex-wrap:wrap}
  .empty code{
    font-family:var(--mono);font-size:12px;color:var(--ink);
    background:#131317;border:1px solid var(--hair);padding:1px 5px;
  }

  /* ---------- footer bar ---------- */
  .dock{
    position:fixed;left:0;right:0;bottom:0;background:#17171B;color:var(--ink);
    border-top:3px solid var(--red);z-index:5;
    box-shadow:0 -14px 26px rgba(0,0,0,.55);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .dock .wrap{display:flex;align-items:center;gap:12px;padding-top:12px;padding-bottom:12px}
  .dock .stat{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;flex:1;min-width:0}
  .dock .stat b{color:#fff;font-size:15px}
  button{
    font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    background:transparent;color:var(--ink);border:1px solid #55555C;padding:8px 12px;cursor:pointer;
  }
  button:hover{border-color:var(--red);color:#fff}
  button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
  button[aria-pressed=true]{border-color:var(--red);color:#fff;background:#22161A}
  .savestate{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#9A9AA4}
  .savestate.warn{color:var(--red)}
  @media(max-width:560px){
    .dock .stat{font-size:10.5px;letter-spacing:.06em}
    .dock .stat b{font-size:13px}
    button{padding:8px 9px;font-size:10px;letter-spacing:.08em}
  }

  footer.colophon{
    margin:44px 0 10px;padding-top:16px;border-top:1px solid var(--hair);
    font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink-soft);
    display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body style="background:#0D0D0F;color:#F2F1EB">

<div class="wrap">
  <div class="library">
    <select id="orderSelect" aria-label="Reading order"></select>
    <button id="libBtn" type="button" aria-expanded="false" title="Manage reading orders">&#8943;</button>
  </div>

  <div class="libmenu" id="libMenu">
    <h3>Reading orders</h3>
    <p class="muted" id="libSummary"></p>
    <div class="row">
      <button id="newBtn" type="button">+ New</button>
      <button id="exampleBtn" type="button">From example</button>
      <button id="importBtn" type="button">Import file</button>
      <button id="duplicateBtn" type="button">Duplicate</button>
      <button id="exportBtn" type="button">Export</button>
      <button id="guideBtn" type="button">How to write a list</button>
      <button id="deleteOrderBtn" type="button">Delete this one</button>
    </div>
    <div class="row">
      <button id="undoBtn" type="button">Undo last change</button>
      <button id="shareBtn" type="button">Copy read-only link</button>
      <button id="backupBtn" type="button">Back up everything</button>
      <button id="restoreBtn" type="button">Restore a backup</button>
    </div>
    <div class="row" id="seedRow"></div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <input type="file" id="restoreFile" accept="application/json,.json" hidden>
  </div>

  <header class="mast">
    <div class="eyebrow">
      <span id="eyebrow"></span>
      <span><b id="sectionRange">&nbsp;</b></span>
    </div>
    <h1 id="mastTitle"></h1>
    <p class="deck" id="deck"></p>

    <div class="mast-tools">
      <button class="tool" id="editMetaBtn" type="button">&#9998; Title &amp; intro</button>
    </div>
    <div id="metaFormHost"></div>

    <div class="meter" style="background:#17171B;color:#F2F1EB">
      <svg class="diagram" viewBox="0 0 130 96" aria-hidden="true">
        <circle id="c616" cx="42" cy="48" r="30" fill="#C42328" opacity=".95"/>
        <circle id="c1610" cx="88" cy="48" r="30" fill="#2E4FA8" opacity=".95"/>
      </svg>
      <div class="readout">
        <div class="big" id="count">0<span> / 0</span></div>
        <div class="lbl" id="pctLabel">&nbsp;</div>
        <div class="bar"><i id="barFill"></i></div>
      </div>
    </div>

    <p class="hint">Editing. Ticks still work; changes save immediately. Deleting an entry also deletes its tick.</p>
  </header>

  <div class="filters">
    <input type="search" id="filterInput" placeholder="Filter this list — series, issue or note" aria-label="Filter this list">
    <button id="hideDoneBtn" type="button" aria-pressed="false">Hide ticked</button>
    <span class="count" id="filterCount"></span>
  </div>

  <main id="sections"></main>

  <div class="adder" id="addSectionWrap">
    <button id="addSectionBtn" type="button">+ Add section</button>
  </div>

  <footer class="colophon">
    <span>Yours to amend</span>
    <span id="tagline"></span>
  </footer>
</div>

<div class="dock" style="background:#17171B;color:#F2F1EB">
  <div class="wrap">
    <div class="stat"><span id="dockMainLabel">Main line</span> <b id="dockMain">0/0</b> &nbsp;&middot;&nbsp; <span id="dockOptLabel">Optional</span> <b id="dockOpt">0/0</b></div>
    <span class="savestate" id="saveState">Loading</span>
    <button id="editBtn" type="button" aria-pressed="false">Edit list</button>
    <button id="resetBtn" type="button">Reset ticks</button>
  </div>
</div>

<script>
/* ---------------------------------------------------------------------------
   Several reading orders, one page.

     /api/orders            the library index
     /api/orders/:id        one order: masthead text + sections (PUT is guarded
                            by rev — a stale editor is refused, not merged)
     /api/state/:id         ticks for that order, as per-item ops merged
                            last-write-wins so no device can revert another
     /api/seeds             bundled examples you can start a new order from

   Ticks are namespaced per order, so two orders can reuse an item id without
   colliding. Item ids are frozen and never derived from the text, which is
   what lets you rename an entry without losing its tick.
--------------------------------------------------------------------------- */

const CURRENT_KEY = "rtsw:current";
const keyList = (id) => "rtsw:list:" + id;
const keyMirror = (id) => "rtsw:mirror:" + id;
const keyPending = (id) => "rtsw:pending:" + id;
const POLL_MS = 60000;

let library = [];      // [{id, title, sections, items, ...}]
let orderId = null;
let order = { rev: 0, sections: [] };
let items = {};        // id -> {c,t}
let pending = [];      // tick ops not yet accepted
let syncing = false;
let dirty = false;
let syncTimer = null;
let editing = false;
let editTarget = null; // {kind:"item"|"section"|"meta", id}

// ?read=1 hides every control, for a link you hand to someone else. It is a
// presentation mode and not a permission: the API is still there for anyone
// who can reach the host, which is what the network gate is for.
const readOnly = new URLSearchParams(location.search).get("read") === "1";
const HIDE_DONE_KEY = "rtsw:hideDone";
let filterText = "";
let hideDone = lsGet(HIDE_DONE_KEY, false) === true;

const host = document.getElementById("sections");
const stateEl = document.getElementById("saveState");

/* ---------- helpers ---------- */

function el(tag, cls, text){
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  // textContent, never innerHTML: all of this is user-editable text.
  if (text != null) node.textContent = text;
  return node;
}

function tool(label, title, onClick, danger){
  const b = el("button", "tool" + (danger ? " danger" : ""), label);
  b.type = "button";
  b.title = title;
  b.setAttribute("aria-label", title);
  b.addEventListener("click", onClick);
  return b;
}

function lsGet(key, fallback){
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch { return fallback; }
}
function lsSet(key, value){
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

function newId(){
  const bytes = new Uint8Array(8);
  crypto.getRandomValues(bytes);
  return "x-" + Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");
}

function status(text, warn){
  stateEl.textContent = text;
  stateEl.classList.toggle("warn", !!warn);
}

function statusIdle(){
  if (pending.length) status(pending.length + " queued", true);
  else if (!navigator.onLine) status("Offline");
  else status("Synced");
}

async function api(path, options){
  const res = await fetch(path, options);
  if (!res.ok) {
    let message = "HTTP " + res.status;
    try { const body = await res.json(); if (body.error) message = body.error; } catch {}
    const err = new Error(message);
    err.status = res.status;
    throw err;
  }
  return res.json();
}

/* ---------- masthead ---------- */

function renderMasthead(){
  document.getElementById("eyebrow").textContent = order.eyebrow || "";
  document.getElementById("deck").textContent = order.deck || "";
  document.getElementById("tagline").textContent = order.tagline || "";

  const h1 = document.getElementById("mastTitle");
  h1.textContent = "";
  const title = order.title || "Reading order";
  const accent = (order.titleAccent || "").trim();
  // The accent is normally the tail of the title ("Road to | Secret Wars"),
  // so split it off rather than printing it twice.
  const lead =
    accent && title.toLowerCase().endsWith(accent.toLowerCase())
      ? title.slice(0, title.length - accent.length).trim()
      : title;
  h1.appendChild(document.createTextNode(lead));
  if (accent) {
    const span = el("span", "thin", accent);
    span.style.color = "#F03A41";
    h1.appendChild(span);
  }
  document.title = title;
}

function metaForm(){
  const form = el("div", "form meta");
  const fields = {};
  const field = (key, label, value) => {
    const wrap = el("div", "field");
    const lbl = el("label", "lbl", label);
    const input = document.createElement("input");
    input.type = "text";
    input.value = value || "";
    lbl.appendChild(input);
    wrap.appendChild(lbl);
    fields[key] = input;
    return wrap;
  };

  form.appendChild(field("title", "Title", order.title));
  form.appendChild(field("titleAccent", "Accent (the part in red, usually the end of the title)", order.titleAccent));
  form.appendChild(field("eyebrow", "Eyebrow (small line above the title)", order.eyebrow));
  form.appendChild(field("deck", "Intro paragraph", order.deck));
  form.appendChild(field("tagline", "Footer tagline", order.tagline));
  form.appendChild(field("progressWord", "Progress word (“40% complete”)", order.progressWord));
  form.appendChild(field("mainLabel", "Name for the required part (“main line”)", order.mainLabel));
  form.appendChild(field("optionalLabel", "Name for the rest (“optional”)", order.optionalLabel));

  const actions = el("div", "actions");
  const save = el("button", "tool", "Save");
  save.type = "button";
  save.addEventListener("click", () => {
    if (!fields.title.value.trim()) { fields.title.focus(); return; }
    order.title = fields.title.value;
    order.titleAccent = fields.titleAccent.value;
    order.eyebrow = fields.eyebrow.value;
    order.deck = fields.deck.value;
    order.tagline = fields.tagline.value;
    order.progressWord = fields.progressWord.value;
    order.mainLabel = fields.mainLabel.value;
    order.optionalLabel = fields.optionalLabel.value;
    editTarget = null;
    commitOrder();
  });
  const cancel = el("button", "tool", "Cancel");
  cancel.type = "button";
  cancel.addEventListener("click", () => {
    editTarget = null;
    loadOrder().then(renderAll);
  });
  actions.appendChild(save);
  actions.appendChild(cancel);
  form.appendChild(actions);

  setTimeout(() => fields.title.focus(), 0);
  return form;
}

/* ---------- section + item forms ---------- */

function buildFields(form, spec){
  const fields = {};
  for (const [key, label, value] of spec) {
    const wrap = el("div", "field");
    const lbl = el("label", "lbl", label);
    const input = document.createElement("input");
    input.type = "text";
    input.value = value || "";
    lbl.appendChild(input);
    wrap.appendChild(lbl);
    form.appendChild(wrap);
    fields[key] = input;
  }
  return fields;
}

function checkbox(parent, label, checked){
  const wrap = el("label", "check");
  const input = document.createElement("input");
  input.type = "checkbox";
  input.checked = !!checked;
  wrap.appendChild(input);
  wrap.appendChild(el("span", null, label));
  parent.appendChild(wrap);
  return input;
}

function itemForm(sec, it){
  const form = el("div", "form");
  const fields = buildFields(form, [
    ["s", "Series", it.s],
    ["i", "Issue", it.i],
    ["note", "Note", it.note],
    ["url", "Link — where to read it (optional)", it.url],
  ]);
  const checks = el("div", "checks");
  const alt = checkbox(checks, "Alternate tint", it.alt);
  form.appendChild(checks);

  const actions = el("div", "actions");
  const save = el("button", "tool", "Save");
  save.type = "button";
  save.addEventListener("click", () => {
    if (!fields.s.value.trim()) { fields.s.focus(); return; }
    it.s = fields.s.value;
    it.i = fields.i.value;
    it.note = fields.note.value;
    it.url = fields.url.value;
    it.alt = alt.checked;
    editTarget = null;
    commitOrder();
  });
  const cancel = el("button", "tool", "Cancel");
  cancel.type = "button";
  cancel.addEventListener("click", () => {
    editTarget = null;
    // The row may be a brand-new blank entry; reloading drops it cleanly.
    loadOrder().then(renderAll);
  });
  const del = el("button", "tool danger", "Delete");
  del.type = "button";
  del.addEventListener("click", () => {
    if (!confirm("Delete “" + (it.s || "this entry") + "” and its tick?")) return;
    sec.items = sec.items.filter(x => x.id !== it.id);
    delete items[it.id];
    editTarget = null;
    commitOrder();
  });

  actions.appendChild(save);
  actions.appendChild(cancel);
  actions.appendChild(el("span", "spacer"));
  actions.appendChild(del);
  form.appendChild(actions);

  setTimeout(() => fields.s.focus(), 0);
  return form;
}

function sectionForm(sec){
  const form = el("div", "form");
  const fields = buildFields(form, [
    ["n", "Number", sec.n],
    ["title", "Title", sec.title],
    ["note", "Note", sec.note],
    ["collected", "Collected editions", sec.collected],
  ]);
  const checks = el("div", "checks");
  const core = checkbox(checks, "Counts toward " + (order.mainLabel || "main line"), sec.core);
  const flag = checkbox(checks, "Flagged note", sec.flag);
  form.appendChild(checks);

  const actions = el("div", "actions");
  const save = el("button", "tool", "Save");
  save.type = "button";
  save.addEventListener("click", () => {
    if (!fields.title.value.trim()) { fields.title.focus(); return; }
    sec.n = fields.n.value;
    sec.title = fields.title.value;
    sec.note = fields.note.value;
    sec.collected = fields.collected.value;
    sec.core = core.checked;
    sec.flag = flag.checked;
    editTarget = null;
    commitOrder();
  });
  const cancel = el("button", "tool", "Cancel");
  cancel.type = "button";
  cancel.addEventListener("click", () => {
    editTarget = null;
    loadOrder().then(renderAll);
  });
  const del = el("button", "tool danger", "Delete section");
  del.type = "button";
  del.addEventListener("click", () => {
    const n = sec.items.length;
    if (!confirm("Delete “" + sec.title + "”" + (n ? " and its " + n + " entries" : "") + "?")) return;
    sec.items.forEach(it => { delete items[it.id]; });
    order.sections = order.sections.filter(s => s.id !== sec.id);
    editTarget = null;
    commitOrder();
  });

  actions.appendChild(save);
  actions.appendChild(cancel);
  actions.appendChild(el("span", "spacer"));
  actions.appendChild(del);
  form.appendChild(actions);

  setTimeout(() => fields.title.focus(), 0);
  return form;
}

/* ---------- rendering ---------- */

function move(arr, index, delta){
  const next = index + delta;
  if (next < 0 || next >= arr.length) return false;
  const [moved] = arr.splice(index, 1);
  arr.splice(next, 0, moved);
  return true;
}

function itemRow(sec, it, si, ii){
  const li = el("li", "row" + (it.alt ? " alt" : ""));

  if (editTarget && editTarget.kind === "item" && editTarget.id === it.id) {
    li.appendChild(itemForm(sec, it));
    return li;
  }

  const label = el("label");
  const box = document.createElement("input");
  box.type = "checkbox";
  box.dataset.id = it.id;
  box.checked = !!(items[it.id] && items[it.id].c);
  box.disabled = readOnly;
  label.appendChild(box);
  label.appendChild(el("span", "box"));

  const title = el("span", "title", it.s);
  if (it.note) title.appendChild(el("span", "note", it.note));
  label.appendChild(title);
  label.appendChild(el("span", "issue", it.i));
  li.appendChild(label);

  // Outside the label on purpose: inside it, opening the link would also tick
  // the row. The server only ever stores http(s) links, so this can't be a
  // javascript: URL.
  if (it.url) {
    const open = el("a", "readlink", "read");
    open.href = it.url;
    open.target = "_blank";
    open.rel = "noopener noreferrer";
    open.title = "Open " + it.s;
    li.appendChild(open);
  }

  const tools = el("div", "tools");
  tools.appendChild(tool("↑", "Move up", () => { if (move(sec.items, ii, -1)) commitOrder(); }));
  tools.appendChild(tool("↓", "Move down", () => { if (move(sec.items, ii, 1)) commitOrder(); }));
  tools.appendChild(tool("✎", "Edit entry", () => {
    editTarget = { kind: "item", id: it.id };
    renderAll();
  }));
  li.appendChild(tools);
  return li;
}

function sectionBlock(sec, si){
  const blk = el("section", "blk");

  const head = el("div", "blk-head");
  head.appendChild(el("span", "num", sec.n));
  head.appendChild(el("h2", null, sec.title));
  const tally = el("span", "tally");
  tally.dataset.tally = String(si);
  head.appendChild(tally);

  const headTools = el("div", "tools");
  headTools.appendChild(tool("↑", "Move section up", () => { if (move(order.sections, si, -1)) commitOrder(); }));
  headTools.appendChild(tool("↓", "Move section down", () => { if (move(order.sections, si, 1)) commitOrder(); }));
  headTools.appendChild(tool("✎", "Edit section", () => {
    editTarget = { kind: "section", id: sec.id };
    renderAll();
  }));
  head.appendChild(headTools);
  blk.appendChild(head);

  if (editTarget && editTarget.kind === "section" && editTarget.id === sec.id) {
    blk.appendChild(sectionForm(sec));
  } else {
    if (sec.note) blk.appendChild(el("p", "blk-note" + (sec.flag ? " flag" : ""), sec.note));
    if (sec.collected) {
      const box = el("div", "blk-collected");
      box.appendChild(el("span", "lbl", "Collected"));
      box.appendChild(el("p", null, sec.collected));
      blk.appendChild(box);
    }
  }

  const ul = el("ul", "list");
  sec.items.forEach((it, ii) => ul.appendChild(itemRow(sec, it, si, ii)));
  blk.appendChild(ul);

  const adder = el("div", "adder");
  const add = el("button", null, "+ Add entry to " + sec.title);
  add.type = "button";
  add.addEventListener("click", () => {
    const it = { id: newId(), s: "", i: "", note: "", url: "", alt: false };
    sec.items.push(it);
    editTarget = { kind: "item", id: it.id };
    renderAll();
  });
  adder.appendChild(add);
  blk.appendChild(adder);

  return blk;
}

// A new order has nothing to show and its only control ("+ Add section") is
// hidden behind edit mode, so say what to do next and offer every route in.
function emptyState(){
  const box = el("div", "empty");
  box.appendChild(el("h2", null, "Nothing in this list yet"));
  box.appendChild(el("p", null,
    "Add sections by hand, copy one of the bundled examples to start from, " +
    "or import a JSON file you (or a model) wrote."));

  const row = el("div", "row");

  const add = el("button", null, "+ Add the first section");
  add.type = "button";
  add.addEventListener("click", () => {
    if (!editing) document.getElementById("editBtn").click();
    document.getElementById("addSectionBtn").click();
  });

  const example = el("button", null, "Start from an example");
  example.type = "button";
  example.addEventListener("click", () => {
    const menu = document.getElementById("libMenu");
    if (!menu.classList.contains("open")) document.getElementById("libBtn").click();
    document.getElementById("exampleBtn").click();
    menu.scrollIntoView({ block: "nearest" });
  });

  const load = el("button", null, "Import a file");
  load.type = "button";
  load.addEventListener("click", () => document.getElementById("importFile").click());

  const guide = el("button", null, "How to write one");
  guide.type = "button";
  guide.addEventListener("click", () => window.open("/authoring.md", "_blank", "noopener"));

  [add, example, load, guide].forEach(b => row.appendChild(b));
  box.appendChild(row);
  return box;
}

function renderAll(){
  renderMasthead();

  const metaHost = document.getElementById("metaFormHost");
  metaHost.textContent = "";
  if (editTarget && editTarget.kind === "meta") metaHost.appendChild(metaForm());

  host.textContent = "";
  (order.sections || []).forEach((sec, si) => host.appendChild(sectionBlock(sec, si)));
  if (!(order.sections || []).length) host.appendChild(emptyState());
  paint();
  applyFilters();
}

// Filtering is presentational only — nothing is written, and a hidden row is
// still counted in the totals, because progress is a fact about the list
// rather than about what you are currently looking at.
function applyFilters(){
  const query = filterText.trim().toLowerCase();
  let shown = 0;

  host.querySelectorAll("section.blk").forEach(blk => {
    let visible = 0;
    blk.querySelectorAll("li.row").forEach(li => {
      const box = li.querySelector("input[data-id]");
      const ticked = box ? box.checked : false;
      const matches = !query || li.textContent.toLowerCase().includes(query);
      // A row being edited stays put whatever the filter says, or the form
      // vanishes under the author mid-sentence.
      const isForm = !!li.querySelector(".form");
      const show = isForm || (matches && !(hideDone && ticked));
      li.style.display = show ? "" : "none";
      if (show) { visible++; shown++; }
    });
    // Keep empty sections while editing so they can still be worked on.
    blk.style.display = visible || editing || !blk.querySelector("li.row") ? "" : "none";
  });

  document.getElementById("filterCount").textContent =
    query || hideDone ? shown + " shown" : "";
}

function paint(){
  let coreDone = 0, coreTotal = 0, optDone = 0, optTotal = 0;

  (order.sections || []).forEach((sec, si) => {
    let done = 0;
    sec.items.forEach(it => {
      const ticked = !!(items[it.id] && items[it.id].c);
      if (ticked) done++;
      if (sec.core) { coreTotal++; if (ticked) coreDone++; }
      else { optTotal++; if (ticked) optDone++; }
    });
    const tally = host.querySelector('[data-tally="' + si + '"]');
    if (tally) {
      tally.textContent =
        String(done).padStart(2, "0") + " / " + String(sec.items.length).padStart(2, "0");
    }
  });

  const pct = coreTotal ? coreDone / coreTotal : 0;
  document.getElementById("count").innerHTML = coreDone + "<span> / " + coreTotal + "</span>";
  const mainLabel = order.mainLabel || "main line";
  const optionalLabel = order.optionalLabel || "optional";
  document.getElementById("pctLabel").textContent =
    Math.round(pct * 100) + "% " + (order.progressWord || "complete") + " · " + mainLabel;
  document.getElementById("barFill").style.width = (pct * 100) + "%";
  document.getElementById("dockMainLabel").textContent = mainLabel;
  document.getElementById("dockOptLabel").textContent = optionalLabel;
  document.getElementById("dockMain").textContent = coreDone + "/" + coreTotal;
  document.getElementById("dockOpt").textContent = optDone + "/" + optTotal;
  document.getElementById("c616").setAttribute("transform", "translate(" + (23 * pct) + ",0)");
  document.getElementById("c1610").setAttribute("transform", "translate(" + (-23 * pct) + ",0)");

  const numbers = (order.sections || []).map(s => s.n).filter(Boolean);
  document.getElementById("sectionRange").textContent =
    numbers.length > 1 ? "Sections " + numbers[0] + "–" + numbers[numbers.length - 1] : "";
}

/* ---------- the library ---------- */

function renderLibrary(){
  const select = document.getElementById("orderSelect");
  select.textContent = "";
  library.forEach(entry => {
    const opt = document.createElement("option");
    opt.value = entry.id;
    opt.textContent = entry.title + "  (" + entry.items + ")";
    opt.selected = entry.id === orderId;
    select.appendChild(opt);
  });
  const current = library.find(e => e.id === orderId);
  document.getElementById("libSummary").textContent = current
    ? library.length + (library.length === 1 ? " order. " : " orders. ") +
      "Showing " + current.title + " — " + current.sections + " sections, " + current.items + " entries."
    : library.length + " orders.";
}

async function loadLibrary(){
  library = await api("/api/orders");
  renderLibrary();
}

async function switchOrder(id){
  if (!id || id === orderId) return;
  if (pending.length) await sync();           // don't strand ticks on the old order
  orderId = id;
  lsSet(CURRENT_KEY, id);
  if (location.hash.slice(1) !== id) location.hash = id;
  editTarget = null;
  order = lsGet(keyList(id), { rev: 0, sections: [] });
  items = lsGet(keyMirror(id), {});
  pending = lsGet(keyPending(id), []);
  renderAll();
  renderLibrary();
  await loadOrder();
  renderAll();
  await sync();
}

/* ---------- order document ---------- */

async function loadOrder(){
  try {
    order = await api("/api/orders/" + orderId);
    lsSet(keyList(orderId), order);
    return true;
  } catch {
    return false; // the mirror already on screen stays valid
  }
}

// Writes the whole order, guarded by rev. A 409 means someone else moved first.
async function commitOrder(){
  renderAll();
  status("Saving");
  try {
    const res = await fetch("/api/orders/" + orderId, {
      method: "PUT",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(order)
    });

    if (res.status === 409) {
      order = await res.json();
      lsSet(keyList(orderId), order);
      editTarget = null;
      renderAll();
      status("List changed elsewhere — reloaded", true);
      return;
    }
    if (!res.ok) {
      let message = "Not saved";
      try { const body = await res.json(); if (body.error) message = "Not saved: " + body.error; } catch {}
      status(message, true);
      await loadOrder();
      renderAll();
      return;
    }

    order = await res.json();
    lsSet(keyList(orderId), order);
    renderAll();
    await loadLibrary();
    statusIdle();
  } catch {
    // Unlike ticks, order edits are not queued: replaying a whole-document
    // write later is exactly the stale overwrite the rev guard prevents.
    status("Offline — not saved", true);
    await loadOrder();
    renderAll();
  }
}

/* ---------- ticks ---------- */

function mergeInto(base, ops){
  for (const op of ops){
    const cur = base[op.id];
    if (!cur || op.t >= cur.t) base[op.id] = { c: op.c, t: op.t };
  }
  return base;
}

async function sync(){
  if (!orderId) return;
  if (syncing) { dirty = true; return; }
  syncing = true;
  const flushing = pending.slice();
  const id = orderId;

  try {
    status(flushing.length ? "Saving" : "Syncing");
    const server = flushing.length
      ? await api("/api/state/" + id, {
          method: "PATCH",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ ops: flushing })
        })
      : await api("/api/state/" + id);

    if (id !== orderId) return; // switched orders mid-flight

    // The server owns exactly what we sent; anything ticked meanwhile stays queued.
    if (flushing.length) {
      pending = pending.slice(flushing.length);
      lsSet(keyPending(id), pending);
    }

    items = mergeInto(Object.assign({}, server.items || {}), pending);
    lsSet(keyMirror(id), items);
    refreshBoxes();
    paint();
    applyFilters();
    statusIdle();
  } catch {
    status(pending.length ? pending.length + " queued" : "Offline", true);
  } finally {
    syncing = false;
    if (dirty) { dirty = false; sync(); }
  }
}

function refreshBoxes(){
  host.querySelectorAll('input[type="checkbox"]').forEach(b => {
    b.checked = !!(items[b.dataset.id] && items[b.dataset.id].c);
  });
}

function scheduleSync(){
  clearTimeout(syncTimer);
  syncTimer = setTimeout(sync, 400);
}

function record(id, checked){
  const op = { id: id, c: checked, t: Date.now() };
  items[id] = { c: op.c, t: op.t };
  pending.push(op);
  lsSet(keyPending(orderId), pending);
  lsSet(keyMirror(orderId), items);
}

/* ---------- events ---------- */

document.addEventListener("change", e => {
  const b = e.target;
  if (!b.matches('input[type="checkbox"][data-id]')) return;
  record(b.dataset.id, b.checked);
  paint();
  applyFilters();
  status("Saving");
  scheduleSync();
});

// Duplicating is the safe way to try a restructure on a list you are midway
// through — the copy starts with no ticks, the original keeps its own.
document.getElementById("duplicateBtn").addEventListener("click", async () => {
  try {
    const created = await api("/api/orders", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ copy: orderId })
    });
    await loadLibrary();
    await switchOrder(created.id);
    status("Duplicated");
  } catch (err) {
    status("Not duplicated: " + err.message, true);
  }
});

document.getElementById("deleteOrderBtn").addEventListener("click", async () => {
  const current = library.find(e => e.id === orderId);
  if (!current) return;
  if (!confirm("Delete “" + current.title + "”, its " + current.items + " entries and every tick on it?")) return;
  try {
    await api("/api/orders/" + orderId, { method: "DELETE" });
    [keyList(orderId), keyMirror(orderId), keyPending(orderId)].forEach(k => {
      try { localStorage.removeItem(k); } catch {}
    });
    const gone = orderId;
    orderId = null;
    await loadLibrary();
    await switchOrder((library.find(e => e.id !== gone) || library[0]).id);
    status("Deleted");
  } catch (err) {
    status("Not deleted: " + err.message, true);
  }
});

document.getElementById("editBtn").addEventListener("click", e => {
  editing = !editing;
  editTarget = null;
  document.body.classList.toggle("editing", editing);
  e.currentTarget.setAttribute("aria-pressed", String(editing));
  e.currentTarget.textContent = editing ? "Done editing" : "Edit list";
  renderAll();
});

document.getElementById("editMetaBtn").addEventListener("click", () => {
  editTarget = editTarget && editTarget.kind === "meta" ? null : { kind: "meta" };
  renderAll();
});

document.getElementById("addSectionBtn").addEventListener("click", () => {
  const sec = { id: newId(), n: "", title: "New section", core: true, flag: false, note: "", collected: "", items: [] };
  order.sections.push(sec);
  editTarget = { kind: "section", id: sec.id };
  commitOrder();
});

document.getElementById("resetBtn").addEventListener("click", () => {
  const ticked = host.querySelectorAll('input[type="checkbox"][data-id]:checked');
  if (!ticked.length) return;
  if (!confirm("Clear all " + ticked.length + " ticks on this order, on every device?")) return;
  ticked.forEach(b => { b.checked = false; record(b.dataset.id, false); });
  paint();
  scheduleSync();
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  sync();
  if (!editTarget) loadOrder().then(ok => { if (ok) renderAll(); });
});
window.addEventListener("online", sync);
window.addEventListener("focus", sync);
setInterval(() => { if (!document.hidden) sync(); }, POLL_MS);

/* ---------- boot ---------- */

(async function boot(){
  if (readOnly) document.body.classList.add("readonly");
  document.getElementById("hideDoneBtn").setAttribute("aria-pressed", String(hideDone));

  // Paint from the mirror first so a cold start shows something immediately,
  // then reconcile with the server.
  const remembered = location.hash.slice(1) || lsGet(CURRENT_KEY, null);
  if (remembered) {
    orderId = remembered;
    order = lsGet(keyList(remembered), { rev: 0, sections: [] });
    items = lsGet(keyMirror(remembered), {});
    pending = lsGet(keyPending(remembered), []);
    renderAll();
    statusIdle();
  }

  try {
    await loadLibrary();
  } catch {
    status("Offline", true);
    return;
  }
  if (!library.length) { status("No reading orders"); return; }

  const wanted = library.find(e => e.id === orderId) ? orderId : library[0].id;
  if (wanted !== orderId) {
    orderId = null;
    await switchOrder(wanted);
  } else {
    lsSet(CURRENT_KEY, orderId);
    if (location.hash.slice(1) !== orderId) location.hash = orderId;
    renderLibrary();
    await loadOrder();
    renderAll();
    await sync();
  }
})();
</script>
</body>
</html>
